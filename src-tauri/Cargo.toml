[package]
name = "hugonic"
version = "0.1.1"
description = "Hugo 静态站点的桌面管理器"
authors = ["Allen Zhang"]
edition = "2024"

[lib]
# `_lib` 后缀用于避免与 bin 同名冲突（参见 rust-lang/cargo#8519）。
name = "hugonic_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
libc = "0.2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = "4.2.0"
zip = "9.1.2"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "rustls"] }
toml_edit = "0.25.17"
serde_yaml = "0.9.34"
base64 = "0.23.1"

[dev-dependencies]
tempfile = "3"

# 体积优化参考：https://tauri.app/concept/size/#cargo-configuration
[profile.dev]
# 只做本地开发，关掉调试信息以控制 target/ 体积
debug = 0

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
